<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="Pipeline: admission CT radiomics and clinical variables form three feature sets; within each training fold of 5-fold stratified cross-validation data are preprocessed, oversampled, reduced with PCA retaining 95% of variance and classified by four models; pooled out-of-fold predictions are evaluated.">
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs>
<rect width="1280" height="440" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
<g font-family="Helvetica, Arial, sans-serif">
<text x="32" y="38" font-size="11.5" font-weight="700" letter-spacing="1.8" fill="#64748b">INPUTS</text>
<text x="282" y="38" font-size="11.5" font-weight="700" letter-spacing="1.8" fill="#64748b">FEATURE SETS</text>
<text x="490" y="38" font-size="11.5" font-weight="700" letter-spacing="1.8" fill="#64748b">WITHIN EACH TRAINING FOLD  (PCA 95%)</text>
<text x="1080" y="38" font-size="11.5" font-weight="700" letter-spacing="1.8" fill="#64748b">EVALUATION</text>
<rect x="32" y="70" width="214" height="104" rx="12" fill="#fff" stroke="#64748b" stroke-width="2"/>
<text x="46" y="96" font-size="15" font-weight="700" fill="#0f172a">Admission CT</text>
<text x="46" y="118" font-size="12" fill="#475569">semi-automatic hemorrhage</text>
<text x="46" y="136" font-size="12" fill="#475569">segmentation → PyRadiomics</text>
<text x="46" y="154" font-size="12" fill="#475569"><tspan font-weight='700' fill='#0f172a'>107</tspan> radiomic features</text>
<rect x="32" y="194" width="214" height="104" rx="12" fill="#fff" stroke="#64748b" stroke-width="2"/>
<text x="46" y="220" font-size="15" font-weight="700" fill="#0f172a">Clinical &amp; laboratory</text>
<text x="46" y="242" font-size="12" fill="#475569">demographics, comorbidity,</text>
<text x="46" y="260" font-size="12" fill="#475569">admission blood tests</text>
<text x="46" y="278" font-size="12" fill="#475569">(outcome fields excluded)</text>
<rect x="282" y="70" width="160" height="72" rx="12" fill="#fff" stroke="#0ea5e9" stroke-width="2"/><rect x="282" y="70" width="8" height="72" rx="4" fill="#0ea5e9"/>
<text x="302" y="100" font-size="15" font-weight="700" fill="#0f172a">Radiomics</text><text x="302" y="122" font-size="12" fill="#475569">107 features</text>
<rect x="282" y="160" width="160" height="72" rx="12" fill="#fff" stroke="#8b5cf6" stroke-width="2"/><rect x="282" y="160" width="8" height="72" rx="4" fill="#8b5cf6"/>
<text x="302" y="190" font-size="15" font-weight="700" fill="#0f172a">Clinical</text><text x="302" y="212" font-size="12" fill="#475569">clinical + laboratory</text>
<rect x="282" y="250" width="160" height="72" rx="12" fill="#fff" stroke="#14b8a6" stroke-width="2"/><rect x="282" y="250" width="8" height="72" rx="4" fill="#14b8a6"/>
<text x="302" y="280" font-size="15" font-weight="700" fill="#0f172a">Combined</text><text x="302" y="302" font-size="12" fill="#475569">radiomics + clinical</text>
<path d="M246 122 C266 122 266 106 280 106" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar)"/>
<path d="M246 122 C270 122 270 276 280 286" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar)"/>
<path d="M246 246 C266 246 266 196 280 196" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar)"/>
<path d="M246 246 C266 246 266 286 280 286" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar)"/>
<line x1="442" y1="106" x2="466" y2="106" stroke="#94a3b8" stroke-width="1.8"/>
<line x1="442" y1="196" x2="466" y2="196" stroke="#94a3b8" stroke-width="1.8"/>
<line x1="442" y1="286" x2="466" y2="286" stroke="#94a3b8" stroke-width="1.8"/>
<line x1="466" y1="106" x2="466" y2="286" stroke="#94a3b8" stroke-width="1.8"/><line x1="466" y1="196" x2="488" y2="196" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="490" y="52" width="560" height="320" rx="16" fill="#ecfdf5" stroke="#14b8a6" stroke-width="1.8" stroke-dasharray="7 5"/>
<rect x="513" y="76" width="118" height="130" rx="12" fill="#fff" stroke="#14b8a6" stroke-width="2"/><circle cx="531" cy="100" r="10" fill="#14b8a6"/><text x="531" y="104" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">1</text><text x="547" y="105" font-size="13.5" font-weight="700" fill="#0f172a">Preprocess</text>
<text x="525" y="140" font-size="11" fill="#475569">median/mode impute</text>
<text x="525" y="160" font-size="11" fill="#475569">z-score scaling</text>
<text x="525" y="180" font-size="11" fill="#475569">one-hot encode</text>
<line x1="632" y1="141" x2="644" y2="141" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="645" y="76" width="118" height="130" rx="12" fill="#fff" stroke="#14b8a6" stroke-width="2"/><circle cx="663" cy="100" r="10" fill="#14b8a6"/><text x="663" y="104" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">2</text><text x="679" y="105" font-size="13.5" font-weight="700" fill="#0f172a">Oversample</text>
<text x="657" y="140" font-size="11" fill="#475569">random minority</text>
<text x="657" y="160" font-size="11" fill="#475569">over-sampling</text>
<text x="657" y="180" font-size="11" fill="#475569">(training data only)</text>
<line x1="764" y1="141" x2="776" y2="141" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="777" y="76" width="118" height="130" rx="12" fill="#fff" stroke="#14b8a6" stroke-width="2"/><circle cx="795" cy="100" r="10" fill="#14b8a6"/><text x="795" y="104" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">3</text><text x="811" y="105" font-size="13.5" font-weight="700" fill="#0f172a">PCA</text>
<text x="789" y="140" font-size="11" fill="#475569">retain 95% of</text>
<text x="789" y="160" font-size="11" fill="#475569">variance</text>
<text x="789" y="180" font-size="11" fill="#475569">15 – 27 components</text>
<line x1="896" y1="141" x2="908" y2="141" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="909" y="76" width="118" height="130" rx="12" fill="#fff" stroke="#14b8a6" stroke-width="2"/><circle cx="927" cy="100" r="10" fill="#14b8a6"/><text x="927" y="104" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">4</text><text x="943" y="105" font-size="13.5" font-weight="700" fill="#0f172a">Classifier</text>
<text x="921" y="140" font-size="11" fill="#475569">Random Forest</text>
<text x="921" y="160" font-size="11" fill="#475569">Gradient Boosting</text>
<text x="921" y="180" font-size="11" fill="#475569">XGBoost · MLP</text>
<text x="513" y="240" font-size="12" font-weight="700" fill="#0f766e">5-fold stratified cross-validation (seed 42)</text>
<rect x="513" y="252" width="96" height="30" rx="8" fill="#a7f3d0" stroke="#14b8a6" stroke-width="1.5"/><text x="561" y="272" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f766e">train: fit</text>
<rect x="617" y="252" width="96" height="30" rx="8" fill="#a7f3d0" stroke="#14b8a6" stroke-width="1.5"/><text x="665" y="272" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f766e">train: fit</text>
<rect x="721" y="252" width="96" height="30" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="1.5"/><text x="769" y="272" text-anchor="middle" font-size="11.5" font-weight="600" fill="#92400e">validation</text>
<rect x="825" y="252" width="96" height="30" rx="8" fill="#a7f3d0" stroke="#14b8a6" stroke-width="1.5"/><text x="873" y="272" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f766e">train: fit</text>
<rect x="929" y="252" width="96" height="30" rx="8" fill="#a7f3d0" stroke="#14b8a6" stroke-width="1.5"/><text x="977" y="272" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f766e">train: fit</text>
<text x="770" y="312" text-anchor="middle" font-size="12" fill="#0f766e">The validation fold is only transformed and scored → no information leakage</text>
<text x="770" y="334" text-anchor="middle" font-size="12" fill="#0f766e">Fold models are refitted from scratch for each of the 5 folds</text>
<line x1="1052" y1="212" x2="1076" y2="212" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="1080" y="70" width="170" height="228" rx="12" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
<text x="1094" y="96" font-size="15" font-weight="700" fill="#0f172a">Pooled OOF</text><text x="1094" y="114" font-size="12" fill="#475569">predictions, n = 86</text>
<text x="1094" y="148" font-size="12" fill="#334155">• AUC · PR-AUC</text>
<text x="1094" y="170" font-size="12" fill="#334155">• Accuracy · F1</text>
<text x="1094" y="192" font-size="12" fill="#334155">• Sensitivity</text>
<text x="1094" y="214" font-size="12" fill="#334155">• Specificity</text>
<text x="1094" y="236" font-size="12" fill="#334155">• PPV · NPV</text>
<text x="1094" y="258" font-size="12" fill="#334155">• Balanced accuracy</text>
<text x="640" y="408" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">3 feature sets × 4 classifiers = 12 PCA models  ·  identical folds for all models  ·  threshold 0.5</text>
</g></svg>