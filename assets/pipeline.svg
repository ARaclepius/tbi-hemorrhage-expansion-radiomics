<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="650" viewBox="0 0 1420 650" role="img" aria-label="TBI radiomics workflow: baseline CT radiomics and clinical data are cleaned and split into radiomics, clinical and combined sets; stratified cross-validation fits preprocessing, oversampling, PCA and classifiers within each training fold; pooled out-of-fold predictions feed bootstrap confidence intervals and DeLong comparisons; fold-wise tree importance and approximate PCA-space SHAP back-projection provide interpretation.">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="1420" height="650" rx="20" fill="#f8fafc" stroke="#e2e8f0"/>
<g font-family="Helvetica,Arial,sans-serif" fill="#0f172a">
<text x="34" y="38" font-size="12" font-weight="700" letter-spacing="1.8" fill="#64748b">INPUT AND FEATURE SETS</text>
<rect x="34" y="56" width="260" height="94" rx="12" fill="#fff" stroke="#64748b" stroke-width="1.8"/>
<text x="52" y="83" font-size="16" font-weight="700">Admission CT radiomics</text><text x="52" y="108" font-size="13" fill="#475569">107 original PyRadiomics features</text><text x="52" y="130" font-size="12" fill="#64748b">Semi-automatic hemorrhage segmentation</text>
<rect x="34" y="172" width="260" height="94" rx="12" fill="#fff" stroke="#64748b" stroke-width="1.8"/>
<text x="52" y="199" font-size="16" font-weight="700">Clinical / laboratory</text><text x="52" y="224" font-size="13" fill="#475569">28 eligible baseline variables</text><text x="52" y="246" font-size="12" fill="#64748b">Identifiers and post-baseline fields excluded</text>
<rect x="34" y="302" width="260" height="94" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
<text x="52" y="329" font-size="16" font-weight="700">Cleaning and leakage checks</text><text x="52" y="354" font-size="13" fill="#475569">Normalize target · convert numeric text</text><text x="52" y="376" font-size="12" fill="#64748b">Drop all-missing / constant / prohibited fields</text>
<path d="M164 150V169 M164 266V299" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="330" y="38" font-size="12" font-weight="700" letter-spacing="1.8" fill="#64748b">THREE FEATURE SETS</text>
<rect x="330" y="70" width="204" height="64" rx="10" fill="#fff" stroke="#0284c7" stroke-width="1.8"/><text x="352" y="98" font-size="16" font-weight="700">Radiomics</text><text x="352" y="119" font-size="12" fill="#475569">107 features</text>
<rect x="330" y="160" width="204" height="64" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.8"/><text x="352" y="188" font-size="16" font-weight="700">Clinical</text><text x="352" y="209" font-size="12" fill="#475569">28 features</text>
<rect x="330" y="250" width="204" height="64" rx="10" fill="#fff" stroke="#0d9488" stroke-width="1.8"/><text x="352" y="278" font-size="16" font-weight="700">Combined</text><text x="352" y="299" font-size="12" fill="#475569">135 features</text>
<path d="M294 349H310V102H328 M310 192H328 M310 282H328" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="568" y="38" font-size="12" font-weight="700" letter-spacing="1.5" fill="#64748b">WITHIN EACH TRAINING FOLD ONLY</text>
<rect x="566" y="56" width="464" height="340" rx="16" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.8" stroke-dasharray="7 5"/>
<rect x="588" y="80" width="195" height="78" rx="10" fill="#fff" stroke="#14b8a6" stroke-width="1.4"/><text x="603" y="106" font-size="14" font-weight="700">1. Preprocess</text><text x="603" y="128" font-size="12" fill="#475569">Impute · scale · one-hot encode</text><text x="603" y="145" font-size="11" fill="#64748b">Fit only on training data</text>
<rect x="804" y="80" width="204" height="78" rx="10" fill="#fff" stroke="#14b8a6" stroke-width="1.4"/><text x="819" y="106" font-size="14" font-weight="700">2. Resample + PCA</text><text x="819" y="128" font-size="12" fill="#475569">Random oversampling then PCA</text><text x="819" y="145" font-size="11" fill="#64748b">Retain 95% variance</text>
<path d="M783 119H802" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="588" y="179" width="420" height="64" rx="10" fill="#fff" stroke="#14b8a6" stroke-width="1.4"/><text x="603" y="205" font-size="14" font-weight="700">3. Classifier</text><text x="603" y="226" font-size="12" fill="#475569">Random Forest · Gradient Boosting · XGBoost · MLP</text>
<path d="M906 158V176" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="588" y="264" width="420" height="46" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.2"/><text x="798" y="292" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">5-fold stratified CV · same splits · seed 42</text>
<text x="798" y="334" text-anchor="middle" font-size="12" fill="#0f766e">Validation fold is transformed and scored only</text><text x="798" y="354" text-anchor="middle" font-size="12" fill="#0f766e">No imputation/scaling/oversampling/PCA fit leakage</text>
<path d="M534 282H564" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="1060" y="38" font-size="12" font-weight="700" letter-spacing="1.4" fill="#64748b">NEW: UNCERTAINTY + COMPARISON</text>
<rect x="1058" y="56" width="328" height="150" rx="12" fill="#fff" stroke="#ea580c" stroke-width="1.8"/>
<text x="1076" y="82" font-size="15" font-weight="700">Pooled OOF evaluation</text><text x="1076" y="106" font-size="12.5" fill="#475569">AUC · PR-AUC · accuracy · sensitivity</text><text x="1076" y="126" font-size="12.5" fill="#475569">specificity · PPV · NPV · F1 · balanced accuracy</text><text x="1076" y="153" font-size="12.5" font-weight="700" fill="#9a3412">Stratified-bootstrap 95% CIs</text><text x="1076" y="178" font-size="12.5" font-weight="700" fill="#9a3412">66 paired DeLong tests + Holm correction</text>
<path d="M1030 122H1056" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="1060" y="240" font-size="12" font-weight="700" letter-spacing="1.4" fill="#64748b">NEW: INTERPRETABLE ML</text>
<rect x="1058" y="258" width="328" height="138" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="1076" y="284" font-size="15" font-weight="700">Fold-averaged feature attribution</text><text x="1076" y="308" font-size="12.5" fill="#475569">Tree importance → PCA-loading back-map</text><text x="1076" y="330" font-size="12.5" fill="#475569">MLP Kernel SHAP → PCA-space attribution</text><text x="1076" y="352" font-size="12.5" fill="#475569">Aggregate one-hot features by source column</text><text x="1076" y="376" font-size="11.5" font-weight="700" fill="#6d28d9">Back-projected SHAP is approximate</text>
<path d="M1030 328H1056" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="34" y="448" width="1352" height="158" rx="14" fill="#0f172a"/>
<text x="58" y="480" font-size="13" font-weight="700" letter-spacing="1.5" fill="#67e8f9">REPRODUCIBLE OUTPUTS</text>
<text x="58" y="511" font-size="14" fill="#f8fafc">CSV tables: OOF metrics + CIs · pairwise DeLong/Holm tests · fold-level and mean feature attribution · run metadata</text>
<text x="58" y="540" font-size="14" fill="#f8fafc">Figures: AUC with 95% CI · ROC curves · confusion matrices · feature importance · approximate SHAP summaries · AUC-difference heatmap</text>
<text x="58" y="573" font-size="12.5" fill="#94a3b8">12 model / feature-set configurations · fixed probability threshold 0.5 · research use only; external validation required</text>
</g></svg>